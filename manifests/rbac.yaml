apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-sa
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: remediation-role
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "update", "patch", "replace"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: remediation-cluster-binding
subjects:
- kind: ServiceAccount
  name: remediation-sa
  namespace: monitoring
roleRef:
  kind: ClusterRole
  name: remediation-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-engine
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediation-engine
  template:
    metadata:
      labels:
        app: remediation-engine
    spec:
      serviceAccountName: remediation-sa
      containers:
      - name: controller
        image: self-healing-controller:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: remediation-service
  namespace: monitoring
spec:
  selector:
    app: remediation-engine
  ports:
  - port: 8080
    targetPort: 8080